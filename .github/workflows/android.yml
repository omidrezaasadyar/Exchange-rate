name: Build Android APK

on:
  push:
    branches:
      - claude/currency-exchange-rates-uDHqV
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/ExchangeRate-debug-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExchangeRate-debug-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/currency-exchange-rates-uDHqV'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Nightly Build #${{ github.run_number }}"
          body: |
            APK ساخته‌شده از کامیت ${{ github.sha }}
            برای نصب: فایل APK را روی گوشی اندرویدی باز کنید
            (نیاز به فعال‌سازی نصب از منابع ناشناس).
          files: artifacts/*.apk
          prerelease: true
          make_latest: true
